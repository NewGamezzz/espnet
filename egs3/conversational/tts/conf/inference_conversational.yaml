##########################################################
#           Conversational F5 - infer stage              #
##########################################################
# Quick usage (from the recipe dir):
#   python run.py --stages infer \
#       --inference_config conf/inference_conversational.yaml
#
# Merged over egs3/TEMPLATE/tts/conf/inference.yaml (which supplies recipe_dir,
# exp_dir, data_dir, ...). The stage is recipe-local (src/inference.py), so the
# TEMPLATE's model/provider/runner blocks are ignored here.

# The stage self-references its training config (model / vocab / feats / hop),
# so `infer` runs with only --inference_config, exactly as generate_dev.py
# loads its --training_config.
training_config: conf/training_poc.yaml

# Dead in the default run.py path: run.py always loads a training config,
# and espnet3.utils.run_utils.apply_training_experiment_context overwrites a
# DIFFERING exp_tag/exp_dir with the training config's values (warning-only
# log), so outputs land under exp/train_poc_multibranch_f5/, not
# exp/eval_pretrained/. This value only takes effect for a standalone
# stage runner that loads no training config (none exists in this recipe
# today); kept for that documented house pattern, see the README's
# "Running the battery" note.
exp_tag: eval_pretrained

# generate = run the model (zero-init gates unless --ckpt); gt = copy the
# ground-truth generated region; resynth = round-trip it through mel + Vocos.
# The three modes write layout-identical trees, one per mode.
mode: generate
device: cpu

inference_dir: ${exp_dir}/infer_${mode}
test_name: valid

# Checkpoint handling mirrors generate_dev.py: null keeps the assembled
# pretrained model (independent F5 passes); a Lightning ckpt supersedes it.
ckpt: null
use_ema: true

dataset:
  split: valid
  manifest_path: null   # null -> resolve from the recipe data dir
  dataset_root: null    # null -> $SSSD_ROOT / dataset config default

# Window selection: filter, then a seeded, capped draw (logged + reproducible).
#
# `manifest` supersedes ALL of the keys below plus the prompt ladder: it points
# at a frozen eval manifest (see src/eval_manifest.py) naming the windows and
# pinning each channel's prompt turn as an explicit session-absolute span. Use
# it whenever a run must be reproducible OUTSIDE this checkout - the seeds only
# reproduce under identical code, identical window manifest and identical
# corpus files, which is exactly what sharing with a collaborator breaks. Build
# one with local/make_eval_manifest.py; a slice of one is itself a valid
# manifest, which is how a long run is split across jobs (this path has no
# shard_count of its own).
selection:
  manifest: null        # frozen eval manifest path; null = seeded draw below
  num_active_speakers: 2
  min_duration: null    # optional duration band (seconds); null = no bound
  max_duration: null
  per_session_cap: null  # at most this many windows per session (AMI: balance meetings)
  num_windows: 50
  seed: 0

# Prompt turn selection: one turn per channel, sampled from elsewhere in the
# same conversation (never from inside the evaluated window - leakage is
# never allowed) and concatenated as the acoustic + text prompt.  A
# relaxation ladder prefers non-window+solo+in-band turns, then drops the
# duration band, then drops the solo requirement; windows where even a
# leakage-free pick doesn't exist are skipped and counted.  See
# src/inference.py's module docstring for the full scheme.
prompt:
  turn_min_sec: 2.0
  turn_max_sec: 10.0
  # "solo" widens the candidate span by this much per side before the
  # overlap test (0.0 = today's rule; AMI uses 0.3 against alignment jitter).
  solo_guard_sec: 0.0
  # Sidecar from local/ami_prompt_gate.py listing turns that may never be
  # prompts (bleed / not solo by annotation); null = no gate.
  exclude_spans: null
  # Loudness convention (null = off, bit-identical): scale each prompt row so
  # the own turn's active RMS hits normalize_db (-23 dBFS = the ZipVoice v2 /
  # baseline convention).  Active threshold = the gate's channel floor
  # (exclude_spans.json floor_db, when present) + normalize_floor_margin_db.
  normalize_db: null
  normalize_floor_margin_db: 10.0
  seed: 0

# Duration policy. ground_truth (default) generates exactly the window length
# (bit-identical to every earlier run). predicted generates F5's per-speaker
# rule (prompt seconds-per-char, shrunk toward the training prior over
# rate_prior_chars characters, x scale / speed) - generate mode, order text
# only; the rule's estimate is recorded in the meta in every mode.
duration:
  source: ground_truth
  scale: 1.117
  speed: 1.0
  rate_prior_chars: null

# Anchor masking: zero every ground-truth sample outside the row's own
# annotated turns (+guard).  Applies to the gt/resynth outputs AND to the
# gt/ copies every mode writes (InteractionMetric's W1 reference); the model
# input in generate mode is never masked.  Off = bit-identical.  On for
# corpora with headset crosstalk (AMI); design note "Beyond Two Speakers
# Evaluation on AMI", section 4.
anchor:
  mask_to_turns:
    enabled: false
    guard_sec: 0.15
  # gt/ copies (after masking) at the same convention; null = off.
  normalize_db: null

# Multi-branch ODE sampling (as generate_dev.py / the F5 inference path).
sampling:
  steps: 32
  cfg_strength: 2.0
  # Sparse-channel guidance (off = null, bit-identical): a channel with
  # <= cfg_sparse_max_chars of window text, or <= cfg_sparse_max_chars_per_sec
  # of generated second, samples at cfg_sparse_strength instead.
  cfg_sparse_strength: null
  cfg_sparse_max_chars: 40
  cfg_sparse_max_chars_per_sec: null
  sway_sampling_coef: -1.0
  seed: 0
