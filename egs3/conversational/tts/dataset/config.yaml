builder:
  # Root of the ScalableSpontaneousSpeechDataset corpus (read-only).
  # Resolution order at runtime: explicit argument > $SSSD_ROOT > this value.
  dataset_root: /work/hdd/bbjs/ttrachu/dataset/ScalableSpontaneousSpeechDataset
  manifests_subdir: lhotse_manifests_48
  audio_subdir: original
  # Pretrained char vocab to extend (one token per line, char_tokens.txt format).
  # REQUIRED at build time; the builder fails if unset or missing.
  base_vocab_path: null
  data_path: data
  manifest_paths:
    train: manifest/train.jsonl
    valid: manifest/valid.jsonl
    test: manifest/test.jsonl
  vocab_path: tokens/vocab.txt
  vocab_meta_path: tokens/vocab_meta.json
  seed: 0
  # Same-channel utterances closer than merge_gap seconds merge into one turn.
  merge_gap: 1.0
  # Training window target duration is drawn uniformly from [window_min, window_max].
  window_min: 10.0
  # 60 s exceeds the F5 pretraining clip regime (< 30 s Emilia clips); chosen
  # deliberately to capture longer interactions - revisit if fine-tuning
  # quality degrades on long windows.
  window_max: 60.0
  # Utterance-boundary cuts; eligibility follows CoVoMix's Fisher
  # segmentation (arXiv:2404.06690), the placement search is ours (hybrid
  # closest-to-target with restart retry, see preprocessing/windows.py).
  # A boundary at t
  # is eligible iff every turn ends >= boundary_guard before t or starts
  # >= boundary_guard after it.  0.0 is faithful to CoVoMix (zero margin,
  # human LDC timestamps); SSSD timestamps are Parakeet pseudo-labels, so
  # this knob exists to reject boundaries where the neighboring utterance's
  # alignment jitter could leak un-covered speech into the window.  May be
  # raised after inspecting debug dumps.
  boundary_guard: 0.0
  # Shortest emitted window below window_min: bounds both the session tail
  # and mid-session mini-windows emitted before an oversized blocked span.
  tail_min: 5.0
  # Transcription-hole guards (SSSD's Parakeet pseudo-labels leave stretches of
  # real speech unlabeled; a window that sweeps one in pairs audio with a
  # transcript that does not cover it - see preprocessing/windows.py).
  # trim_to_turns shrinks each window to [first turn start, last turn end],
  # losslessly removing lead-in/trail-out holes; a window trimmed below tail_min
  # is dropped. min_coverage is a conservative backstop for interior holes: drop
  # a window whose transcribed union covers less than this fraction of its
  # duration (0.0 disables). A turn-coverage floor cannot distinguish a hole
  # from a genuine silent pause, so keep it low. Both default off, preserving
  # the current build and byte-compatibility with the bagpiper windowing copy.
  trim_to_turns: false
  min_coverage: 0.0
  # snap_start_to_turn begins each window on the next turn instead of the
  # previous cut, skipping the silence/hole between them so the length budget
  # covers speech (raises coverage; skipped seconds are reported as
  # snapped-gaps). It brackets the leading edge during selection; trim_to_turns
  # brackets the trailing edge it leaves. Defaults off (byte-compatible build).
  snap_start_to_turn: false
  split_ratios:
    train: 0.96
    valid: 0.02
    test: 0.02
  source_sample_rate: 48000

dataset:
  sample_rate: 24000
  split_manifest_paths:
    train: manifest/train.jsonl
    valid: manifest/valid.jsonl
    test: manifest/test.jsonl
  # Built by the builder, consumed by the preprocessor, not the dataset:
  # training configs point ConversationalTextPreprocessor's token_list here
  # (the dataset itself is vocab-agnostic and yields raw turns).
  vocab_path: tokens/vocab.txt
  # F5 convention: the model does text + 1 and uses 0 as its internal filler,
  # so batches pad text ids with -1 (see espnet2/tts/f5/backbones/dit.py).
  text_pad_value: -1

libritts_builder:
  # Root of the LibriTTS corpus (read-only), containing train-clean-100/ etc.
  # Resolution order at runtime: explicit argument > $LIBRITTS_ROOT > this value.
  # NOTE: placeholder Delta path - CONFIRM the real location before the prep run.
  dataset_root: /work/hdd/bbjs/ttrachu/dataset/LibriTTS
  train_subsets:
    - train-clean-100
    - train-clean-360
    - train-other-500
  valid_subset: dev-clean
  # Seeded subsample of the valid subset, in hours (keeps validation cheap).
  valid_hours: 1.0
  # Utterances shorter than this are dropped (ratified 2026-07-30).
  min_duration: 1.0
  # LibriTTS native rate; the builder fails loudly on any file that differs.
  sample_rate: 24000
  manifest_paths:
    train: manifest/libritts_train.jsonl
    valid: manifest/libritts_valid.jsonl
  seed: 0

candor_builder:
  # CANDOR corpus root (read-only): candor_data/ + Candor_lhotse/manifests/.
  # Resolution order at runtime: explicit argument > $CANDOR_ROOT > this value.
  dataset_root: /work/hdd/bbjs/shared/Candor
  manifests_subdir: Candor_lhotse/manifests
  # Turn segmentation variant: cliffhanger (canonical) / audiophile / backbiter.
  variant: cliffhanger
  # One-time mp3 -> FLAC transcode target (libsndfile in the training envs has
  # no MPEG support; mp3 also lacks sample-accurate seeks). ~240 GB for 942 h.
  # Resolution order: explicit argument > $CANDOR_FLAC_DIR > this value.
  flac_dir: /work/hdd/bbjs/ttrachu/dataset/candor_flac
  ffmpeg: ffmpeg
  transcode_workers: 16
  sample_rate: 48000
  # Windowing knobs: same VALUES as the SSSD builder section, own keys so the
  # corpora can diverge later without touching each other.
  merge_gap: 1.0
  window_min: 10.0
  window_max: 60.0
  boundary_guard: 0.0
  tail_min: 5.0
  trim_to_turns: false
  min_coverage: 0.0
  snap_start_to_turn: false
  split_ratios:
    train: 0.96
    valid: 0.02
    test: 0.02
  manifest_paths:
    train: manifest/candor_train.jsonl
    valid: manifest/candor_valid.jsonl
    test: manifest/candor_test.jsonl
  seed: 0
