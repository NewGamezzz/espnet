##########################################################
#          MULTI-COMPRESSION INFERENCE SETTING           #
##########################################################
# Quick usage:
#   python run.py --stages infer \
#       --training_config conf/training_encodec_multicomp.yaml \
#       --inference_config conf/inference_multicomp.yaml
#
# Merged over egs3/TEMPLATE/codec/conf/inference.yaml (see
# conf/inference.yaml for the merge mechanics). Runs the encode ->
# decode roundtrip of the multi-compression fine-tuned codec at the
# configured compression `rate`.
#
# The wrapped architecture is rebuilt from
# ${exp_dir}/multicomp_model.yaml (dumped by src.factory during the
# train stage), and the fine-tuned averaged checkpoint is loaded
# strictly on top.
#
# For a rate sweep, override `rate` (and `inference_dir`, so runs do
# not overwrite each other), e.g.:
#   --inference_config conf/inference_multicomp.yaml \
#   -o 'model.rate=0.25' 'inference_dir=${exp_dir}/inference_r0.25'

dataset:
  test:
    - name: test
      data_src_args:
        split: test
        inference: true

model:
  _target_: src.inference.MultiCompressionAudioCoding
  train_config: ${exp_dir}/multicomp_model.yaml
  # Fine-tuned checkpoint (wrapped key layout). Lightning checkpoints
  # (last.ckpt) are unwrapped automatically and loaded strictly. Do NOT
  # use ave_Nbest.pth: the current framework writes those files EMPTY
  # (AverageCheckpointsCallback bug); the strict load here would raise.
  model_file: ${exp_dir}/last.ckpt
  rate: 0.5
  # Anchor constraint (optional): layers at/after this index may only
  # place boundaries inside the union of the earlier layers' boundaries.
  # null disables; e.g. 2 anchors layers 2+ on layers 0-1.
  anchor_start_layer: null

output_fn: src.inference.build_output
output_artifacts:
  wav:
    type: wav
    sample_rate: 24000
