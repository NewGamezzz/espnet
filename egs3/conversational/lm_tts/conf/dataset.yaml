builder:
  # Root of the ScalableSpontaneousSpeechDataset corpus (read-only).
  # Resolution order at runtime: --dataset-root > $SSSD_ROOT > this value.
  # Same corpus/layout as the F5 recipe (egs3/conversational/tts/dataset).
  dataset_root: /work/hdd/bbjs/ttrachu/dataset/ScalableSpontaneousSpeechDataset
  manifests_subdir: lhotse_manifests_48
  audio_subdir: original
  seed: 0
  # Same-channel utterances closer than merge_gap seconds merge into one turn.
  merge_gap: 1.0
  # Training window target duration is drawn uniformly from [window_min, window_max].
  window_min: 10.0
  window_max: 60.0
  # Utterance-boundary cuts; eligibility follows CoVoMix's Fisher
  # segmentation (arXiv:2404.06690); see preprocessing/windows.py.
  boundary_guard: 0.0
  # Shortest emitted window below window_min: bounds both the session tail
  # and mid-session mini-windows emitted before an oversized blocked span.
  tail_min: 5.0
  split_ratios:
    train: 0.96
    valid: 0.02
    test: 0.02
  source_sample_rate: 48000
  # Wav write rate for cut_window_wavs/load_window_channel and the rate
  # per-speaker measurement audio is loaded at.
  target_sample_rate: 16000
  # Cap on cumulative per-speaker measurement audio (earliest turns first).
  # librosa.pyin cost scales with input duration; 120 s of voiced speech is
  # far more than needed for a stable median F0 / F0 IQR estimate, so this
  # bounds build time on speakers with very long train-split histories
  # without materially changing the measured bands.
  measure_cap_sec: 120.0
