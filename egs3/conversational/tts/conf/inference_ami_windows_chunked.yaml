##########################################################
#  Conversational F5 - AMI windows on the CHUNKED path    #
##########################################################
# The ZipVoice-Dialog protocol applied to the AMI K-strata windows (Thanapat
# 2026-09-08): the frozen pool manifest is exported by
# local/export_ami_baseline_inputs.py --gt into an external test set
# (prompt wavs = LibriTTS pool utterances, gt wavs = masked headset audio,
# both -23 dBFS) and Chorus generates each window as ONE 45 s chunk through
# src/chunked_inference.py with the special-token prompt
# (<speaker_prompt> audio + <prev_chunk>), exactly the stage-2 final
# ZipVoice recipe: cfg 3.5, steps 64, cond_prompt_sec 1.5, sparse CFG
# 2.0/40, batch 1.  local/make_ami_chunked_runs.py overrides per arm: mode,
# ckpt, training_config, testset, inference_dir, and for the all-on
# transcripts recipe cond_format/cfg (see there).
training_config: conf/generated/training_chorus_eval.yaml
exp_tag: ami_eval
mode: generate_external_chunked
device: cuda
inference_dir: ${exp_dir}/ami_windows_chunked
test_name: valid
ckpt: null
use_ema: true
prompt_fill: room_tone

testset:
  manifest: exp/ami/external/k4_sub20_pool_v2/manifest.jsonl
  name: ami_k4_sub20_pool_v2

duration:
  scale: 1.048
  speed: 1.0
  source: predicted
  rate_prior_chars: 100.0

selection:
  dialogue_ids: null
  min_duration: null
  max_duration: null
  num_dialogues: null
  seed: 0
  shard_index: 0
  shard_count: 1

# The special-token path degrades under batch padding far below the LibriTTS
# cliff (ZipVoice audit 2026-08-27): always batch 1.
batching:
  max_batch_audio_sec: null
  max_batch_dialogues: 1

sampling:
  steps: 64
  cfg_strength: 3.5
  cfg_sparse_strength: 2.0
  cfg_sparse_max_chars: 40
  sway_sampling_coef: -1.0
  seed: 0
  autocast_dtype: bfloat16

chunk:
  cond_format: special_tokens
  cond_prompt_sec: 1.5
  cond_prev_sec: 5.0
  text_format: order
  unchunked_max_sec: null
  turns: null
  target_sec: 45.0
  cross_fade_sec: 0.1
  cond_silence_gate: true
  cond_gate_fill: room_tone
  cond_loudness_norm: true
