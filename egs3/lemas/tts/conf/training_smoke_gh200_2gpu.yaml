# 2-GPU smoke of training_f5_base_dualprompt_gh200.yaml for ghx4-interactive:
# checks that the aarch64 env trains this recipe, that a batch_bins 2M
# micro-batch fits a GH200 in bf16, and that a second link resumes. Own
# exp_tag (a 2-GPU step sees half the frames, so these steps must not join
# the run) and an offline CSVLogger; otherwise identical, which
# tests/test_training_config.py pins. Run two links:
#   NO_CHAIN=1 sbatch --partition=ghx4-interactive --ntasks-per-node=2 \
#     --gpus-per-node=2 --time=00:20:00 local/submit_train_dtai.sbatch \
#     conf/training_smoke_gh200_2gpu.yaml
#
# Stages: create_dataset -> create_token_list -> create_shape -> train.
# create_shape writes feats_shape analytically (upper bound at the longest
# prompt layout), so collect_stats is not used.
num_device: 2
num_nodes: 1
seed: 0

recipe_dir: .
data_dir: ${recipe_dir}/data
exp_dir: ${recipe_dir}/exp/${exp_tag}
# feats_shape is a property of the corpus and the prompt caps, not of one
# experiment, so it is shared across exp_tags.
stats_dir: ${recipe_dir}/exp/stats
inference_dir: ${exp_dir}/inference
exp_tag: smoke_gh200_2gpu

sample_rate: 24000
n_mel_channels: 100
hop_length: 256
win_length: 1024
n_fft: 1024
mel_spec_type: vocos
token_list: ${data_dir}/tokens/tokens.txt

# Online prompt draws (dataset/dataset.py). Lengths in seconds, uniform
# within the range; the speaker coin is heavier because the speaker prompt
# also reveals the language (spec decision 9).
block_samples: 2097152   # 4 MB pack block = read/cache unit (see dataset/extract.py)

prompt_config:
  spk_prompt_sec: [1.0, 6.0]
  lang_prompt_sec: [1.0, 6.0]
  split_frac: [0.2, 0.4]
  split_min_prompt_sec: 1.0
  spk_neighbor_k: 8
  p_drop_spk: 0.3
  p_drop_lang: 0.1
  block_samples: ${block_samples}
  lang_block_span: 1       # language prompt from blocks b-1..b+1

create_dataset:
  recipe_dir: ${recipe_dir}

# Stock espnet3 stage over manifest column 3 (space-separated phone tokens).
create_token_list:
  manifest_path: ${data_dir}/manifest/train.tsv
  save_path: ${data_dir}/tokens
  filename: tokens.txt
  token_type: word
  cleaner: null
  g2p: null
  non_linguistic_symbols: null
  bpemodel: null
  add_symbol:
    - "<blank>:0"
    - "<unk>:1"
    - "<spk>:-1"
    - "<lang>:-1"
    - "<de>:-1"
    - "<en>:-1"
    - "<es>:-1"
    - "<fr>:-1"
    - "<id>:-1"
    - "<it>:-1"
    - "<pt>:-1"
    - "<ru>:-1"
    - "<vi>:-1"
    - "<zh>:-1"
    - "<sos/eos>:-1"
  vocabulary_size: -1
  # tokens seen <= cutoff times over ~30 M rows are noise (stray symbols);
  # they map to <unk>
  cutoff: 20

create_shape:
  splits: [train, valid]
  save_path: ${stats_dir}
  hop_length: ${hop_length}
  sample_rate: ${sample_rate}
  n_mels: ${n_mel_channels}
  manifest_paths:
    train: ${data_dir}/manifest/train.tsv
    valid: ${data_dir}/manifest/valid.tsv
  prompt_config: ${prompt_config}

dataset:
  _target_: espnet3.components.data.data_organizer.DataOrganizer
  recipe_dir: ${recipe_dir}
  train:
    - data_src_args:
        split: train
        manifest_path: ${data_dir}/manifest/train.tsv
        token_list: ${token_list}
        prompt_config: ${prompt_config}
        seed: ${seed}
  valid:
    - data_src_args:
        split: valid
        manifest_path: ${data_dir}/manifest/valid.tsv
        token_list: ${token_list}
        prompt_config: ${prompt_config}
        seed: ${seed}
  # The dataset emits token ids and the concatenated waveform itself.
  preprocessor: null

parallel:
  env: local
  n_workers: 1

model:
  _target_: src.model.DualPromptF5TTS
  token_list: ${token_list}
  feats_extract_config:
    fs: ${sample_rate}
    n_fft: ${n_fft}
    hop_length: ${hop_length}
    win_length: ${win_length}
    n_mels: ${n_mel_channels}
    mel_spec_type: ${mel_spec_type}
  # F5TTS_Base (upstream F5TTS_Base.yaml / paper Table 3).
  hidden_size: 1024                 # upstream `dim`
  depth: 22
  attention_heads: 16               # upstream `heads`
  attention_head_size: 64           # upstream `dim_head`
  feed_forward_multiplier: 2        # upstream `ff_mult`
  text_embedding_size: 512          # upstream `text_dim`
  text_mask_padding: true
  convolution_layers: 4             # upstream `conv_layers`
  sigma: 0.0
  audio_drop_probability: 0.3       # upstream `audio_drop_prob`
  condition_drop_probability: 0.2   # upstream `cond_drop_prob`
  mask_fraction_range: [0.7, 1.0]   # used only by sentinel rows (tests)
  ode_solver_method: euler

optimizer:
  _target_: torch.optim.AdamW
  lr: 1.5e-4
  betas: [0.9, 0.999]
  weight_decay: 0.01

scheduler:
  _target_: espnet3.components.schedulers.linear_warmup_decay.LinearWarmupDecayLR
  warmup_steps: 20000
  total_steps: 300000
scheduler_interval: step

best_model_criterion:
  - - valid/loss
    - 1
    - min

dataloader:
  collate_fn:
    _target_: espnet2.train.collate_fn.CommonCollateFn
    int_pad_value: 0
    float_pad_value: 0.0
    not_sequence: [cond_frames]
  # Plain torch DataLoader (no iter_factory): batches come from the top-level
  # batch_sampler, which keeps every batch inside one 4 MB pack block so the
  # latency-bound Lustre reads amortise (see src/sampler.py).
  train:
    iter_factory: null
    num_workers: 12
    prefetch_factor: 4
    pin_memory: false
  valid:
    iter_factory: null
    num_workers: 4
    prefetch_factor: 2
    pin_memory: false

# One instance per split (instantiated with the split's dataset). numel counts
# frames x n_mels; 800,000 = 8,000 frames per micro-batch. 1,000,000 peaked at
# 38 GB on rank 0 of a 4-GPU A100-40G node (31 GB allocated + 5.5 GB fragmented
# reserve + 3 x 416 MB sibling-rank contexts) and went OOM at batch ~300.
#
# batches_per_epoch cuts one pass over the data (1,578,954 micro-batches per
# rank, about 154 h) into short epochs. espnet3 writes last.ckpt at the end of
# an epoch and nowhere else, and Lightning resumes exactly only from such a
# checkpoint (a mid-epoch resume restarts the loader at its first batch), so
# the epoch is the resume granularity of the 1 h chain links. 1,000
# micro-batches = 100 optimizer steps = about 5 min on 4 A100.
batch_sampler:
  _target_: src.sampler.BlockBatchSampler
  batch_bins: 2000000
  n_mels: ${n_mel_channels}
  min_batch_size: 1
  seed: ${seed}
  batches_per_epoch: 400

trainer:
  accelerator: auto
  # required by the plain-DataLoader path: the sampler shards by rank and
  # the dataset must learn the epoch before its workers fork
  use_distributed_sampler: false
  reload_dataloaders_every_n_epochs: 1
  devices: ${num_device}
  num_nodes: ${num_nodes}
  # 4 GPUs x 8,000 frames x 10 = 320k frames per update (F5: 307,200).
  accumulate_grad_batches: 4
  max_steps: 300000
  precision: bf16-mixed
  max_epochs: -1   # epochs are short (batch_sampler.batches_per_epoch); max_steps ends the run
  # Validation at the end of EVERY epoch. Lightning 2.6.5 resumes an
  # epoch-end checkpoint exactly only when a validation is due at that epoch
  # end; otherwise it trains the first batch of the finished epoch once more
  # and takes an optimizer step on it (tests/test_resume.py).
  # 50 batches per rank = about a quarter of the validation set, 5 s.
  check_val_every_n_epoch: 1
  limit_val_batches: 50
  log_every_n_steps: 50
  gradient_clip_val: 1.0
  strategy: auto
  plugins:
    - _target_: src.checkpoint_io.MmapCheckpointIO
  callbacks:
    - _target_: espnet3.components.callbacks.ema.EMACallback
      decay: 0.9999
    # Permanent backups every 250 epochs = 25,000 steps, next to espnet3's own
    # last.ckpt (rewritten at the end of every epoch) and the best ckpts. Full
    # checkpoints (5.4 GB, EMA inside) written at epoch ends, so each one can
    # be evaluated and resumed from. To evaluate in between, copy the file
    # last.ckpt points to; the best ckpts are weights-only and hold no EMA.
    - _target_: lightning.pytorch.callbacks.ModelCheckpoint
      dirpath: ${exp_dir}
      filename: "backup_step{step}"
      auto_insert_metric_name: false
      every_n_epochs: 250
      save_on_train_epoch_end: true
      save_top_k: -1
      save_last: false
  logger:
    _target_: lightning.pytorch.loggers.CSVLogger
    save_dir: ${exp_dir}
    name: csv

fit: {}
