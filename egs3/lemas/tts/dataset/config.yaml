builder:
  mirror_root: /work/hdd/bbjs/ttrachu/dataset/LEMAS
  manifest_dir: manifests_poc3k          # relative to mirror_root
  # int16 packs (see dataset/extract.py): shard packs from the tars, then one
  # chunk-contiguous pack per language; dir striped -c 4 -S 4M
  audio_root: /work/hdd/bbjs/ttrachu/dataset/LEMAS/poc3k_pcm24k
  chunk_rows: 32     # rows of one speaker/recording laid out contiguously
  n_buckets: 128     # regroup hash buckets per language (RAM ~ pack / n_buckets)
  data_path: data
  langs: [de, en, es, fr, id, it, pt, ru, vi, zh]
  sample_rate: 24000     # pack rate = model rate; Emilia en/zh keep their bandwidth
  min_target_sec: 1.0
  max_target_sec: 20.0
  # Rows whose raw text matches are dropped before phonemization. Emilia-ZH
  # carries English sentences (1.7% of zh rows) that pypinyin would pass
  # through as raw words.
  drop_text_regex:
    zh: "[A-Za-z]"
  split_min_sec: 4.0
  split_min_prompt_sec: 1.0
  split_frac: [0.2, 0.4]
  valid_rows_per_lang: 500
  seed: 20260905
  n_workers: 32
  manifest_paths:
    train: manifest/train.tsv
    valid: manifest/valid.tsv
  lang_stats_path: lang_stats.json

dataset:
  split_manifest_paths:
    train: manifest/train.tsv
    valid: manifest/valid.tsv
