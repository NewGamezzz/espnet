# VITS scoring config: the LibriTTS valid and test splits.
#
# conf/metrics.yaml is the F5-TTS one. It is scoped to the librispeech_pc
# test set and uses fwhisper_wer, which needs a separate faster-whisper
# install. This config keeps the whisper_wer backend instead, so VITS does
# not need that install.
dataset:
  test:
    - name: valid
    - name: test

metrics:
  - metric:
      _target_: src.metrics.versa.VersaMetric
      score_config:
        - name: pseudo_mos
          predictor_types: [utmos, dnsmos]
          predictor_args:
            utmos:
              fs: 16000
            dnsmos:
              fs: 16000
        - name: whisper_wer
          model_tag: default
          beam_size: 1
        - name: speaker
          model_tag: espnet/voxcelebs12_ecapa_wavlm_joint
      wav_key:  wav
      ref_key:  ref
      text_key: text
      use_gpu:  true
    inputs:
      wav:  wav
      ref:  ref
      text: text
