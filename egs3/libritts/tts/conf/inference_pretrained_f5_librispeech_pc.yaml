# Paper-protocol eval: LibriSpeech-PC test-clean cross-sentence (1127 pairs,
# same-speaker prompts), generated with the OFFICIAL pretrained SWivid/F5-TTS
# "F5TTS_Base" checkpoint (as a sanity baseline against our own trained small
# model in conf/inference_f5_librispeech_pc.yaml) and scored EXTERNALLY by the
# official eval_librispeech_test_clean.py. See vault note
# "Design - F5-TTS Small LibriSpeech-PC Eval".
#
# BRIEF-PREMISE CORRECTION: the task-5 brief said this file should clone its
# model block from an existing `conf/inference_pretrained_f5.yaml`. That file
# does not exist anywhere in this repo or its history (checked: `find` across
# the worktree and `git log --all` for the path both come up empty). There is
# also no existing recipe config anywhere in this repo that supplies F5's
# official pinyin tokenizer (F5PinyinPreprocessor + Emilia_ZH_EN_pinyin
# vocab.txt) -- egs3/libritts/tts/conf/training_f5_tts.yaml is our own
# from-scratch F5TTS_Base architecture trained on LibriTTS with char
# tokenization, not the official pretrained weights' pinyin vocab. This
# config is therefore NOT submittable as-is: `train_config` below is a
# placeholder path that Task 7 must create (a small recipe-shaped YAML with a
# `model:` block matching F5TTS_Base's tts_conf and a
# `dataset.preprocessor:` block using F5PinyinPreprocessor with a
# `vocab_file` pointing at the downloaded Emilia_ZH_EN_pinyin/vocab.txt --
# see espnet2/tts/f5/inference.py's `_build_tokenizer` for the exact shape
# it expects: `dataset.preprocessor._target_` containing "F5PinyinPreprocessor"
# or a `vocab_file` key). Record for Task 7: download the official
# SWivid/F5-TTS "F5TTS_Base" checkpoint + its vocab.txt into this eval
# checkout's downloads/, and author that train_config YAML alongside them.
recipe_dir: .
exp_tag: eval_librispeech_pc_pretrained_base
exp_dir: ${recipe_dir}/exp/${exp_tag}
data_dir: ${recipe_dir}/data
inference_dir: ${exp_dir}/${self_name:}

# Same dataset/output blocks as conf/inference_f5_librispeech_pc.yaml (Task 4
# Step 5 shape).
dataset:
  _target_: espnet3.components.data.data_organizer.DataOrganizer
  recipe_dir: ${recipe_dir}
  test:
    - name: librispeech_pc
      data_src: egs3.libritts.tts.dataset.librispeech_pc
      data_src_args:
        manifest_path: ${data_dir}/librispeech_pc/manifest.tsv
        fs: 24000

parallel:
  env: local
  n_workers: 1

model:
  _target_: espnet2.tts.f5.inference.F5TTSInference
  # TODO(Task 7): author this file -- F5TTS_Base tts_conf (dim=1024, depth=22,
  # heads=16, ff_mult=2, text_dim=512, conv_layers=4) + dataset.preprocessor
  # using F5PinyinPreprocessor and the downloaded vocab_file (see the header
  # comment above). Not yet created anywhere in this repo.
  train_config: ${recipe_dir}/downloads/F5TTS_Base/train_config.yaml
  # TODO(Task 7): download the official checkpoint from the SWivid/F5-TTS HF
  # repo (F5TTS_Base/model_*.safetensors or .pt) into downloads/.
  ckpt_path: ${recipe_dir}/downloads/F5TTS_Base/model.safetensors
  use_ema: true
  # Official checkpoint's CFM-level weights, not an espnet/Lightning ckpt --
  # see espnet2/tts/f5/inference.py's `native_f5` docstring (loads straight
  # into model.tts.cfm; tts_conf and token_list in train_config MUST match
  # F5TTS_Base + Emilia_ZH_EN_pinyin/vocab.txt exactly).
  native_f5: true
  vocoder_name: vocos
  vocoder_path: null
  target_sample_rate: 24000
  nfe_step: 32
  cfg_strength: 2.0
  sway_sampling_coef: -1.0
  speed: 1.0
  seed: 0

input_key: [text, ref_speech, ref_text]
batch_size: null
output_fn: src.inference.build_output
output_artifacts:
  wav:
    type: wav
    sample_rate: 24000

provider:
  _target_: espnet3.systems.base.inference_provider.InferenceProvider
runner:
  _target_: espnet3.systems.base.inference_runner.InferenceRunner
