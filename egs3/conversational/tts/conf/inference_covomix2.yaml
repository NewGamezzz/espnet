##########################################################
#   Conversational F5 - infer on the CoVoMix2 test set    #
##########################################################
# Generate from the public CoVoMix2 dialogue test set
# (https://github.com/vivian556123/covomix2-dialogue-testset): 1000 written
# DailyDialog dialogues, each with two LibriSpeech test-clean acoustic
# prompts.  See src/external_testset.py for the adapter and
# src/external_inference.py for what differs from the SSSD path.
#
# Quick usage (from the recipe dir):
#   python run.py --stages infer measure \
#       --inference_config conf/inference_covomix2.yaml \
#       --metrics_config conf/metrics_covomix2.yaml
#
# This config never touches the SSSD infer path: `mode: generate_external`
# dispatches to a separate implementation, and conf/inference_conversational
# .yaml is left alone so the existing infer_generate* runs stay reproducible.
#
# RUNTIME BUDGET (default = all 1000 dialogues, nothing filtered)
# ---------------------------------------------------------------
# Total predicted audio is 10.4 h (37,565 s, mean 37.6 s/dialogue), measured
# by the shipped estimator over the real prompts - not extrapolated.  The measured
# effective RTF of the SSSD infer_generate_cfg3_finetune23k run was 1.45
# (median per-window 1.34, max 4.39) on one A100, and RTF grows with length
# because attention is quadratic in frames:
#
#   ~15 h on one GPU at RTF 1.45, ~20-25 h once the long tail is priced in.
#
# The 159 dialogues over 60 s are 16% of the count but 37% of the audio and
# a larger share of the compute again.  The infer stage is single-GPU and
# sequential, so budget one long job (gpuA100x4 allows 2-00:00:00) rather
# than the 8 h chunks training uses.  For a smoke test set
# `selection.num_dialogues` to something small and SAY SO when reporting.

training_config: conf/training_poc.yaml
exp_tag: eval_covomix2
mode: generate_external
device: cuda
inference_dir: ${exp_dir}/infer_${mode}
test_name: valid

# null -> keep the assembled pretrained model (zero-init gates); a training
# ckpt supersedes every pretrained weight.
ckpt: null
use_ema: true

testset:
  # Clone of vivian556123/covomix2-dialogue-testset (contains
  # dailydialog-dialogue.json and transcriptions/).
  root: downloads/covomix2-dialogue-testset
  # Directory CONTAINING test-clean/ - the index's prompt paths are relative
  # to it.  On Delta: /work/hdd/bbjs/shared/corpora/librispeech/LibriSpeech
  librispeech_root: /work/hdd/bbjs/shared/corpora/librispeech/LibriSpeech
  num_channels: 2

# Duration policy.  This test set ships NO reference audio, so the generated
# duration is predicted, and duration is the only timing signal this model
# receives - it is a reported hyperparameter, recorded in every meta JSON.
#
# The rule is F5-TTS's own (seconds-per-character measured on the prompt,
# scaled by generated text length; utils_infer.py), applied PER SPEAKER and
# corrected by `scale`:
#
#   scale = (SSSD articulation / LibriSpeech articulation) / SSSD density
#         = (0.0735 / 0.0690) / 0.954 = 1.117
#
# retargeting read-speech rate to spontaneous and adding the conversational
# silence budget.  Set scale: 1.0 for F5's uncorrected rule.
#
# `speed` keeps F5's sense (larger = faster = shorter).  Sweep it at
# 0.9 / 1.0 / 1.1 to MEASURE how much the interaction metrics depend on the
# duration policy rather than assuming they don't.
duration:
  scale: 1.117
  speed: 1.0

selection:
  # DEFAULT IS FULL COVERAGE: null/null generates all 1000 dialogues, so a
  # result on this config is "the CoVoMix2 test set" with no subsetting
  # caveat attached.
  #
  # Measured over all 1000 dialogues with the real vocab and real LibriSpeech
  # prompt durations at scale 1.117, the predicted duration runs p10 10.7 s,
  # median 29.8 s, p90 75.3 s, max 203.7 s.  Setting max_duration would keep:
  #   60 s (the training window_max) -> 819/1000
  #   45 s                           -> 699/1000
  #   30 s                           -> 504/1000
  # Excluded dialogues are counted and logged, never silently dropped, and
  # since the excluded ones are the LONG ones specifically, any band makes
  # the reported subset biased short.  That bias is the reason the default
  # is full coverage.
  #
  # THE COST OF FULL COVERAGE - two things to know when reading the results:
  #
  # 1. Out of regime.  181 dialogues exceed the 60 s training window_max and
  #    the longest is 203.7 s, 3.4x beyond it and well past F5's own
  #    pretraining regime.  Rotary position extrapolation that far has never
  #    been validated for this model, so degradation on the tail is expected
  #    and is a property of the length, not of the fine-tuning.  Report the
  #    metrics stratified by predicted duration (<=60 s vs beyond) so the
  #    in-regime number stays readable next to the full-coverage one.
  # 2. Runtime.  Attention is quadratic in frames, so the tail is far more
  #    expensive than its share of the count.  See the header of this file
  #    for the measured budget.
  min_duration: null
  max_duration: null
  # null -> every dialogue that passes the band.
  #
  # Default to the full in-band set, NOT a 50-window sample: the SSSD runs
  # showed that a 4.5-point WER move between checkpoints sits inside the
  # noise at n=50, and this test set costs nothing per dialogue beyond GPU
  # time (no corpus access, no reference audio to stage).  Set a small
  # number here only for a smoke test, and say so when reporting it.
  num_dialogues: null
  seed: 0

  # Sharding, for splitting the ~15-25 h single-GPU run across parallel jobs
  # or across the GPUs of one node.  Each shard is a separate process and
  # pays the recipe's fixed startup cost (~12.5 min measured on Delta: pixi
  # activation plus the espnet import off Lustre), so the useful shard count
  # is lower than raw parallelism suggests - 4 shards spend ~50 min of
  # aggregate overhead against ~20 h of work, 32 would spend over 6 h.
  # Applied LAST, after the band and the
  # subsample, so every shard sees the same population and the union of all
  # shards is exactly the unsharded selection.
  #
  # Assignment is greedy longest-processing-time on predicted duration, not
  # striping: the length distribution is skewed enough (159 dialogues over
  # 60 s carry 37% of the audio) that a stripe can hand one shard most of
  # the tail and that shard becomes the wall clock.  Every shard computes
  # the same split independently - no coordination, no shared state.
  #
  # Each shard writes its own `<name>.scp.<i>of<n>` and shares the
  # wav/prompt/mix/meta directories (filenames are keyed by dialogue id).
  # When every shard is done:
  #     python local/merge_shards.py <inference_dir>/<test_name>
  # which refuses to write a partial merge unless --allow-partial is passed.
  # Leave shard_count at 1 for a single run: the plain SCP names are written
  # directly and no merge step is needed.
  shard_index: 0
  shard_count: 1

sampling:
  steps: 32
  cfg_strength: 3.0
  sway_sampling_coef: -1.0
  seed: 0
