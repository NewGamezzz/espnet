# Per-language scoring of the dual-prompt model on LEMAS-eval.
#
# The test-set names match conf/inference_lemas_eval.yaml (one set per
# language), so every metric below is reported per language.
#
#   WER   VERSA fwhisper_wer (faster-whisper large-v3, beam 5), the engine
#         the LibriTTS recipe uses; the language is auto-detected per
#         utterance, which large-v3 does reliably on multi-second clips.
#   SIM   speaker similarity of the output to the SPEAKER prompt (`ref`),
#         ESPnet-SPK ECAPA on WavLM-large as in the LibriTTS recipe.
#   leak  the same similarity to the LANGUAGE prompt's voice (`lang_ref`);
#         the design's leakage probe, it should stay low and must not rise
#         from arm B (speaker only) to arm A (both prompts).
#   UTMOS as in the LibriTTS recipe.
#
# For the spk-only arm, replace the test-set names with lemas_eval_spk_<lang>.
dataset:
  test:
    - name: lemas_eval_de
    - name: lemas_eval_en
    - name: lemas_eval_es
    - name: lemas_eval_fr
    - name: lemas_eval_id
    - name: lemas_eval_it
    - name: lemas_eval_pt
    - name: lemas_eval_ru
    - name: lemas_eval_vi
    - name: lemas_eval_zh

metrics:
  - metric:
      _target_: src.metrics.versa.VersaMetric
      score_config:
        - name: fwhisper_wer
          model_tag: large-v3
          beam_size: 5
          compute_type: float16
          text_cleaner: whisper_basic
        - name: speaker
          model_tag: espnet/voxcelebs12_ecapa_wavlm_joint
        - name: pseudo_mos
          predictor_types: [utmos]
          predictor_args:
            utmos:
              fs: 16000
      wav_key: wav
      ref_key: ref
      text_key: text
      use_gpu: true
    inputs:
      wav: wav
      ref: ref
      text: text
  - metric:
      _target_: src.metrics.versa.VersaMetric
      score_config:
        - name: speaker
          model_tag: espnet/voxcelebs12_ecapa_wavlm_joint
      wav_key: wav
      ref_key: lang_ref
      text_key: text
      use_gpu: true
    inputs:
      wav: wav
      lang_ref: lang_ref
      text: text
