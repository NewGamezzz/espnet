##########################################################
#           Conversational F5 - measure stage             #
##########################################################
# Quick usage (from the recipe dir):
#   python run.py --stages measure --metrics_config conf/metrics.yaml
#
# Merged over egs3/TEMPLATE/tts/conf/metrics.yaml (recipe_dir, exp_tag,
# exp_dir). `exp_tag`/`exp_dir` are normally inherited from training_config /
# inference_config at run time
# (espnet3.utils.run_utils.apply_training_experiment_context), which also
# copies `inference_dir` from inference_config into this config so `measure`
# scores whatever `infer` just wrote.
#
# How that copy actually behaves (espnet3.utils.run_utils
# _copy_config_context): it reads values with OmegaConf `.get()`, which
# eagerly RESOLVES interpolations in each config's own namespace. So the
# value copied from inference_config is always a concrete resolved path
# (never a raw `${...}` formula), and the "same value -> skip overwrite"
# comparison likewise compares resolved strings. The one real trap is on the
# TARGET side: if this file's own `inference_dir` formula referenced a key
# this file does not define (e.g. `${mode}` without a local `mode:`), the
# very first `.get()` on it -- inside the propagation compare, or at final
# resolve -- raises InterpolationKeyError. Hence `mode` is declared locally
# below, which also lets a standalone `--stages measure` run (no infer in
# the same invocation) resolve `inference_dir` on its own. Keep `mode` in
# lockstep with conf/inference_conversational.yaml's default; override both
# together to score the `gt`/`resynth` anchor runs instead.
mode: generate
inference_dir: ${exp_dir}/infer_${mode}

dataset:
  test:
    - name: valid

# The four metric classes below (ConversationASRMetric, SpeakerDynamicsMetric,
# InteractionMetric, ChannelQualityMetric; see README.md's Evaluation section
# for the summary-key glossary) each iterate `meta.scp` only
# (`inputs: {meta: meta}`). These are the PLAN-step4.md "First real run"
# debug-run defaults: valid split (above), sensible VAD/normalizer/embedder
# defaults, laughter and DNSMOS off. Specifically, every backend below is the
# real (lazy) default -- nothing here is a fake/test double -- and none of it
# downloads or imports anything until the first real `measure` call:
# ConversationASRMetric uses faster-whisper large-v3 transcription, whisper's
# EnglishTextNormalizer, silero VAD, and segments.py's dGSLM IPU defaults.
# SpeakerDynamicsMetric uses WavLM-SV x-vector embedding
# (microsoft/wavlm-base-plus-sv -- an accessible default, not necessarily the
# checkpoint pinned for the first Delta run; the plan defers that exact pin to
# implementation time against the Delta pixi env, see src/metrics/speaker.py's
# module docstring) and silero VAD. InteractionMetric uses silero VAD, with
# laughter detection left disabled (no `laughter_detector` configured -- see
# src/metrics/interaction.py's module docstring). ChannelQualityMetric uses
# the UTMOS22-strong default (torch.hub-based, NOT the PyPI `speechmos`
# package -- see src/metrics/quality.py's module docstring for the verified
# deviation from the plan's wording) with DNSMOS left off
# (`enable_dnsmos: false`).
metrics:
  - metric:
      _target_: egs3.conversational.tts.src.metrics.asr.ConversationASRMetric
    inputs:
      meta: meta
  - metric:
      _target_: egs3.conversational.tts.src.metrics.speaker.SpeakerDynamicsMetric
    inputs:
      meta: meta
  - metric:
      _target_: egs3.conversational.tts.src.metrics.interaction.InteractionMetric
    inputs:
      meta: meta
  - metric:
      _target_: egs3.conversational.tts.src.metrics.quality.ChannelQualityMetric
    inputs:
      meta: meta
