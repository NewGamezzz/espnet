# 2-GPU GPU-small variant of training_f5_tts_base_smoke.yaml.
#
# WHAT THIS IS FOR. Production is 8 GPUs, but the two questions this run has
# to answer do not need 8:
#
#   1. Does F5-TTS Base fit on a V100-32 at the configured batch_bins?
#      Peak memory is a PER-RANK quantity, and espnet3 gives each rank whole
#      batches (batches[rank::world_size]) rather than a slice of one, so the
#      answer does not depend on GPU count at all.
#   2. How many optimizer updates per hour? Time per update is
#      accumulate_grad_batches micro-steps plus the allreduce. Because
#      accumulate_grad_batches is LEFT AT THE PRODUCTION VALUE below, each
#      rank does the same 4 micro-steps per update it would do in production,
#      so updates/hour transfers directly, modulo allreduce cost growing from
#      2 ranks to 8.
#
# WHAT IT DOES NOT COVER. It does not exercise the removed
# len(batch) >= world_size guard, despite min_batch_size being 1: drop_last
# drops the single sub-4 batch, so realized sizes are 4..35 and none fall
# below world_size=2. That guard binds at production width instead, where
# world_size is 8 and the ~2000 batches of size 4-6 all sit below it. Only
# the 8-GPU run demonstrates it end to end.
#
# GLOBAL BATCH IS DELIBERATELY NOT 307,200 HERE. num_device 2 x accum 8 x
# batch_bins 960000 / 100 mels = 153,600 mel-frames per update, half of
# production (4 GPUs x 8 accum). That is correct for an INSTRUMENT and wrong
# for training: this config must never be used for a real run. Raising
# accumulate_grad_batches to 16 would restore 307,200 but double the
# micro-steps per update, which would break the throughput comparison this
# config exists to make.
#
# PATHS. recipe_dir and vocab_file read from the environment, defaulting to
# "." so this file resolves exactly like the Base config when unset (which is
# what lets the test compare them). The smoke subset lives outside the recipe
# tree, so local/submit_smoke_2gpu.sbatch sets:
#   EMILIA_SMOKE_ROOT   -> the subset root holding data/ and exp/stats
#   EMILIA_RECIPE_ROOT  -> the recipe dir holding downloads/vocab.txt
#
# Changed vs. training_f5_tts_base_smoke.yaml (4 places): num_device,
# exp_tag, recipe_dir, vocab_file. Everything else, batch_bins and
# min_batch_size and accumulate_grad_batches above all, is untouched.
#
# GPU smoke config: a short, fully-instrumented run at PRODUCTION settings,
# used to measure the number the whole campaign budget depends on (updates
# per hour at the real batch_bins) plus peak GPU memory and startup cost.
#
# This is a full standalone copy of training_f5_tts_base.yaml, not a thin
# override: run.py's load_and_merge_config merges each config over the
# near-empty egs3.TEMPLATE.tts default, never over another recipe config, so
# a partial file here would silently fall back to template defaults instead
# of inheriting the Base config. See tests/test_training_config.py's
# test_smoke_config_only_differs_from_base_in_five_places, which asserts the
# two configs are byte-for-byte identical (once resolved) except for
# exactly the 5 keys changed below -- that assertion is what makes the
# smoke's throughput number meaningful, since the entire point is to
# measure PRODUCTION throughput. `exp_dir` and `inference_dir` also
# resolve differently between the two configs, but only as a DERIVED
# consequence of the single `exp_tag` change (both interpolate
# `${exp_tag}`) -- the test counts them explicitly as expected, not as
# independent differences, so this is still "5 keys changed", not 7.
# `stats_dir` deliberately does NOT differ (CRITICAL 3): it is fixed at
# `${recipe_dir}/exp/stats`, not derived from `${exp_dir}`/`${exp_tag}`,
# specifically so create_shape's real output (written once, under the
# Base config's exp_tag) is exactly where this config's dataloader reads
# it from.
#
# Changed vs. training_f5_tts_base.yaml (5 places):
#   1. exp_tag: train_f5_tts_base_emilia -> smoke_base_emilia
#   2. trainer.max_steps: 1200000 -> 200
#   3. trainer.val_check_interval: 5000 -> 100
#   4. trainer.limit_val_batches: 200 -> 5
#   5. trainer.logger: WandbLogger -> offline CSVLogger (no network
#      dependency on a compute node, and no wandb run left behind by a
#      one-off smoke test). CSVLogger writes local files only, so there is
#      no "offline mode" flag to set the way WandbLogger has one; NOTE:
#      espnet3/components/callbacks/default_callbacks.py installs a
#      LearningRateMonitor() unconditionally, and Lightning refuses that
#      callback with `logger: false` -- so this MUST be a real logger, not
#      `false`.
#
# Not changed, deliberately: batch_bins, accumulate_grad_batches,
# architecture, optimizer/scheduler, everything else -- the point of this
# config is to measure production throughput, not smoke-test something
# smaller. (num_device IS changed here, unlike in the 8-GPU smoke; see
# this file's own header for why that does not compromise the
# measurement.)
task: espnet2.tasks.tts.TTSTask

num_device: 2
num_nodes: 1

recipe_dir: ${oc.env:EMILIA_SMOKE_ROOT,.}
data_dir: ${recipe_dir}/data
exp_dir: ${recipe_dir}/exp/${exp_tag}
# feats_shape is a property of the corpus (manifest durations), not of a
# specific experiment -- fixed at ${recipe_dir}/exp/stats, not
# experiment-scoped via ${exp_dir}. This MUST match
# training_f5_tts_base.yaml's stats_dir exactly: the README's documented
# sequence runs create_shape once against the base config, then submits the
# smoke, which never runs create_shape itself -- an experiment-scoped
# stats_dir here would make the smoke read shape files that were never
# written under its own exp_tag.
stats_dir: ${recipe_dir}/exp/stats
inference_dir: ${exp_dir}/inference

exp_tag: smoke2gpu_base_emilia

# Mel / audio front-end settings shared by feats_extract and the model.
sample_rate: 24000
n_mel_channels: 100
hop_length: 256
win_length: 1024
n_fft: 1024
mel_spec_type: vocos

vocab_file: ${oc.env:EMILIA_RECIPE_ROOT,.}/downloads/vocab.txt

create_dataset:
  recipe_dir: ${recipe_dir}

# Replaces collect_stats: synthesizes feats_shape analytically from manifest
# durations instead of running the model's feats_extract over every sample.
# See src/system.py TTSSystem.create_shape and the spec, section 5.4.
create_shape:
  splits: [train, valid]
  save_path: ${stats_dir}
  hop_length: ${hop_length}
  sample_rate: ${sample_rate}
  n_mels: ${n_mel_channels}
  manifest_paths:            # read directly; no DataOrganizer coupling
    train: ${data_dir}/manifest/train.tsv
    valid: ${data_dir}/manifest/valid.tsv

dataset:
  _target_: espnet3.components.data.data_organizer.DataOrganizer
  recipe_dir: ${recipe_dir}
  train:
    - data_src_args:
        split: train
        manifest_path: ${data_dir}/manifest/train.tsv
        fs: ${sample_rate}    # ensure consistent sampling rate via resampling in the dataset
  valid:
    - data_src_args:
        split: valid
        manifest_path: ${data_dir}/manifest/valid.tsv
        fs: ${sample_rate}    # ensure consistent sampling rate via resampling in the dataset
  # F5's own pinyin/char preprocessor, matching the official inference path
  # (espnet2/text/f5_preprocessor.py) instead of espnet2's CommonPreprocessor.
  # The mel is produced inside the model by feats_extract: vocoder_mel.
  preprocessor:
    _target_: espnet2.text.f5_preprocessor.F5PinyinPreprocessor
    vocab_file: ${vocab_file}
    text_name: text
    train: true

parallel:
  env: local
  n_workers: 1

# espnet2 task args (consumed by get_espnet_model -> TTSTask.build_model ->
# ESPnetTTSModel). Same shape as the VITS recipe's `model:` block.
model:
  token_list: ${vocab_file}        # 2545 lines -> idim=2545 -> Embedding(2546)
  token_type: char
  odim: null                       # derived from feats_extract.output_size()
  feats_extract: vocoder_mel
  feats_extract_conf:
    fs: ${sample_rate}
    n_fft: ${n_fft}
    hop_length: ${hop_length}
    win_length: ${win_length}
    n_mels: ${n_mel_channels}
    mel_spec_type: ${mel_spec_type}
  # F5 trains on raw vocos log-mel; no mean/variance stats needed
  # (create_shape replaces collect_stats on that basis).
  normalize: null
  tts: f5tts
  tts_conf:                        # F5TTS_Base, Table 3
    dim: 1024
    depth: 22
    heads: 16
    dim_head: 64
    ff_mult: 2
    text_dim: 512
    text_mask_padding: false
    pe_attn_head: 1
    conv_layers: 4
    sigma: 0.0
    audio_drop_prob: 0.3
    cond_drop_prob: 0.2
    frac_lengths_mask: [0.7, 1.0]
    odeint_method: euler
    mel_spec_kwargs:               # raw-waveform inference fallback inside CFM
      n_fft: ${n_fft}
      hop_length: ${hop_length}
      win_length: ${win_length}
      n_mel_channels: ${n_mel_channels}
      target_sample_rate: ${sample_rate}
      mel_spec_type: ${mel_spec_type}
  model_conf: {}

optimizer:
  _target_: torch.optim.AdamW
  lr: 7.5e-5
  betas: [0.9, 0.999]      # F5-TTS uses AdamW defaults
  weight_decay: 0.01

scheduler:
  # F5-TTS schedule: linear warmup then linear decay to ~0 (SequentialLR).
  # total_steps MUST match the planned run (epochs * updates_per_epoch).
  _target_: espnet2.schedulers.linear_warmup_decay.linear_warmup_decay
  warmup_steps: 20000
  total_steps: 1200000
scheduler_interval: step

best_model_criterion:
  - - valid/loss
    - 1
    - min

dataloader:
  collate_fn:
    _target_: espnet2.train.collate_fn.CommonCollateFn
    # F5TTS remaps padded text to its filler id internally (via text_lengths),
    # so the espnet2 default int_pad_value=0 is fine here.
    int_pad_value: 0
    float_pad_value: 0.0
  train:
    num_shards: 1
    iter_factory:
      _target_: espnet2.iterators.sequence_iter_factory.SequenceIterFactory
      # INSIDE iter_factory, not beside it. espnet3's _build_iter_factory
      # instantiates ONLY the iter_factory block, so num_workers/pin_memory
      # placed as siblings of it are silently dead -- the 2-GPU smoke (job
      # 43635433) ran with num_workers=0 and paid iter_time=0.624s of
      # dataloader wait against train_time=1.751s, i.e. 26% of every step
      # spent decoding mp3 on the main process. egs3/libritts's config
      # documents this same trap.
      num_workers: 4
      pin_memory: true
      shuffle: true
      collate_fn: ${dataloader.collate_fn}
      batches:
        # Stock espnet2 sampler, same as the LibriTTS F5 recipe. An earlier
        # revision used a custom numpy-backed variant carrying upstream
        # F5-TTS's per-batch sample cap of 64; both justifications for it
        # were measured and neither held:
        #   - The cap is inert. It was argued from Emilia's 0.3s duration
        #     floor (28 frames -> 340+ samples in a short-end batch), but
        #     Emilia ships 3-30s segments and this corpus's minimum is
        #     3.004s, so realized batch sizes run 1..35 and 0 of 9,997
        #     batches ever reach 64.
        #   - The memory saving is real but not needed: ~4.3 GB vs ~12.4 GB
        #     per rank extrapolated to 37M utterances, i.e. ~35 GB vs
        #     ~100 GB across 8 ranks on a 515 GB node. Stock is also faster
        #     to construct at every size measured.
        # The two produce identical partitions at 116k/500k/2M/8M
        # utterances, so this is not a behavioural change.
        type: numel
        batch_size: 1          # required by signature, unused for "numel"
        # 1, NOT world_size. min_batch_size is a FLOOR the sampler may not
        # close below, and the sampler closes on
        #   current_count * current_length * n_mels > batch_bins
        # so any floor above 1 lets a batch of `floor` long utterances cost
        # floor * L_max frames no matter what batch_bins says -- batch_bins
        # stops bounding memory. Emilia's 30s cap makes L_max 2813 frames,
        # and the first GPU smoke (job 43582509) OOM'd exactly this way:
        # min_batch_size 8 bound 72% of batches and peaked at 25,317 padded
        # frames against a 4,800 nominal budget.
        #
        # At 1 the floor never forces an overshoot, so peak padded frames is
        # batch_bins/n_mels plus one length gap in the ascending sort.
        # Measured on the smoke corpus (116,152 utts): peak 11,990 frames vs
        # 9,600 nominal, and 24.81 GiB of a V100-32's 31.73 under real 2-rank
        # DDP (parity/mem_probe.py, job 43631681). The gap term shrinks as
        # the corpus grows, so the full 37M-utterance run peaks no higher.
        #
        # It costs essentially nothing: exactly ONE batch of 9,997 comes out
        # smaller than 4 samples (a single batch of 1), and the batch count
        # is unchanged from min_batch_size 4 (9,997 vs 9,996). F5 conditions
        # via AdaLN and has no BatchNorm, so a batch of 1 is well-defined.
        min_batch_size: 1
        # The original rationale here (keeping the trailing 1-7 sample
        # remainder from tripping espnet3's len(batch) >= world_size check)
        # is obsolete: that check was espnet2's, wrong for espnet3, and has
        # been removed. Retained anyway -- at ~101k batches per epoch a
        # ragged final batch buys nothing, and espnet3 drops tail batches to
        # align ranks regardless.
        drop_last: true
        shape_files:
          - ${stats_dir}/train/feats_shape
        # Same value as egs3/libritts/tts/conf/training_f5_tts_small.yaml,
        # i.e. a per-GPU budget already proven on a V100-32.
        # Production value, unchanged: per-rank memory and per-micro-step
        # cost must match production for this run to measure anything.
        # With num_device 2 the GLOBAL batch is 153,600 frames, not the
        # production 307,200 -- see the header. Instrument, not training.
        batch_bins: 960000     # 960000 * 8 accum * 2 gpu / 100 mels = 153600
  valid:
    num_shards: 1
    iter_factory:
      _target_: espnet2.iterators.sequence_iter_factory.SequenceIterFactory
      # INSIDE iter_factory, not beside it. espnet3's _build_iter_factory
      # instantiates ONLY the iter_factory block, so num_workers/pin_memory
      # placed as siblings of it are silently dead -- the 2-GPU smoke (job
      # 43635433) ran with num_workers=0 and paid iter_time=0.624s of
      # dataloader wait against train_time=1.751s, i.e. 26% of every step
      # spent decoding mp3 on the main process. egs3/libritts's config
      # documents this same trap.
      num_workers: 4
      pin_memory: true
      shuffle: false
      collate_fn: ${dataloader.collate_fn}
      batches:
        type: ${dataloader.train.iter_factory.batches.type}
        batch_size: 1          # required by signature, unused for "numel"
        # Must track train's floor. Validation shares train's batch_bins, so
        # a floor left at 8 here reintroduces exactly the 25,317-frame batch
        # that OOM'd. That it did not OOM in the first smoke was luck, not
        # safety: the valid loader does not shuffle, so it walks the
        # length-sorted order short-to-long and limit_val_batches stops it
        # before the long tail -- which silently stops protecting anything
        # the moment limit_val_batches is raised.
        min_batch_size: 1
        drop_last: true
        shape_files:
          - ${stats_dir}/valid/feats_shape
        batch_bins: ${dataloader.train.iter_factory.batches.batch_bins}

trainer:
  accelerator: auto
  devices: ${num_device}
  num_nodes: ${num_nodes}
  accumulate_grad_batches: 8
  # Smoke-only: stop well short of the paper's target, just enough steps to
  # exercise warmup, a validation pass and a stable-state throughput window.
  max_steps: 200
  save_every_n_train_steps: 200
  val_check_interval: 100        # smoke-only: one validation pass mid-run
  limit_val_batches: 5           # smoke-only: a handful of batches, not 200
  log_every_n_steps: 50
  max_epochs: -1
  gradient_clip_val: 1.0
  strategy: auto
  callbacks:
    - _target_: espnet3.components.callbacks.ema.EMACallback
      decay: 0.9999
  # Offline CSVLogger, not `logger: false` -- see the header comment above.
  logger:
    _target_: lightning.pytorch.loggers.CSVLogger
    save_dir: ${exp_dir}
    name: ""
    version: ${exp_tag}

# Same reasoning as training_f5_tts_base.yaml: an unconditional
# fit.ckpt_path FileNotFoundErrors on a fresh run. The smoke is a one-shot
# job (submit_smoke.sbatch, no chaining), so it always starts fresh; kept
# empty here for the same reason, and to keep this a byte-for-byte copy of
# the base config outside the 5 documented differences above.
fit: {}
