##########################################################
#           Conversational F5 - measure stage             #
##########################################################
# Quick usage (from the recipe dir):
#   python run.py --stages measure --metrics_config conf/metrics.yaml
#
# Merged over egs3/TEMPLATE/tts/conf/metrics.yaml (recipe_dir, exp_tag,
# exp_dir). `exp_tag`/`exp_dir` are normally inherited from training_config /
# inference_config at run time
# (espnet3.utils.run_utils.apply_training_experiment_context), which also
# copies `inference_dir` from inference_config into this config so `measure`
# scores whatever `infer` just wrote.
#
# How that copy actually behaves (espnet3.utils.run_utils
# _copy_config_context): it reads values with OmegaConf `.get()`, which
# eagerly RESOLVES interpolations in each config's own namespace. So the
# value copied from inference_config is always a concrete resolved path
# (never a raw `${...}` formula), and the "same value -> skip overwrite"
# comparison likewise compares resolved strings. The one real trap is on the
# TARGET side: if this file's own `inference_dir` formula referenced a key
# this file does not define (e.g. `${mode}` without a local `mode:`), the
# very first `.get()` on it -- inside the propagation compare, or at final
# resolve -- raises InterpolationKeyError. Hence `mode` is declared locally
# below, which also lets a standalone `--stages measure` run (no infer in
# the same invocation) resolve `inference_dir` on its own. Keep `mode` in
# lockstep with conf/inference_conversational.yaml's default; override both
# together to score the `gt`/`resynth` anchor runs instead.
mode: generate
inference_dir: ${exp_dir}/infer_${mode}

dataset:
  test:
    - name: valid

# The four metric classes (ConversationASRMetric, SpeakerDynamicsMetric,
# InteractionMetric, ChannelQualityMetric) land across tasks 3-5; each entry
# is `{metric: {...}, inputs: {meta: meta}}` iterating meta.scp only.
# ConversationASRMetric (task 3) uses its real (lazy) defaults here: whisper
# large-v3 transcription, whisper's EnglishTextNormalizer, silero VAD, and
# segments.py's dGSLM IPU defaults. Task 6 updates these to the debug-run
# configuration; the remaining metric classes are still `[]`-shaped ahead of
# tasks 4/5.
metrics:
  - metric:
      _target_: egs3.conversational.tts.src.metrics.asr.ConversationASRMetric
    inputs:
      meta: meta
