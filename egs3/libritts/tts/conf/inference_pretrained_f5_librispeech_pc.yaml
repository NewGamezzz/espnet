# Paper-protocol eval: LibriSpeech-PC test-clean cross-sentence (1127 pairs,
# same-speaker prompts), generated with the OFFICIAL pretrained SWivid/F5-TTS
# "F5TTS_Base" checkpoint (as a sanity baseline against our own trained small
# model in conf/inference_f5_librispeech_pc.yaml) and scored EXTERNALLY by the
# official eval_librispeech_test_clean.py. See vault note
# "Design - F5-TTS Small LibriSpeech-PC Eval".
#
# Model block mirrors conf/training_pretrained_f5.yaml + the reference
# sanity-test config (native_f5: true, F5TTS_Base arch via train_config,
# official model_1200000.safetensors checkpoint, vocos vocoder, nfe_step 32 /
# cfg_strength 2.0 / sway -1.0). Dataset/output blocks are the same
# librispeech_pc split as conf/inference_f5_librispeech_pc.yaml (Task 4 Step
# 5 shape).
recipe_dir: .
exp_tag: eval_librispeech_pc_pretrained_base
exp_dir: ${recipe_dir}/exp/${exp_tag}
data_dir: ${recipe_dir}/data
inference_dir: ${exp_dir}/${self_name:}

dataset:
  _target_: espnet3.components.data.data_organizer.DataOrganizer
  recipe_dir: ${recipe_dir}
  test:
    - name: librispeech_pc
      data_src: egs3.libritts.tts.dataset.librispeech_pc
      data_src_args:
        manifest_path: ${data_dir}/librispeech_pc/manifest.tsv
        fs: 24000

parallel:
  env: local
  n_workers: 1

model:
  _target_: espnet2.tts.f5.inference.F5TTSInference
  # Rebuilds F5TTS_Base + the pinyin tokenizer from this stub config.
  train_config: ${recipe_dir}/conf/training_pretrained_f5.yaml
  # Official SWivid/F5-TTS checkpoint (.safetensors), downloaded via HF into
  # pretrained/F5TTS_Base/ (Task 7 Step B).
  ckpt_path: ${recipe_dir}/pretrained/F5TTS_Base/model_1200000.safetensors
  native_f5: true
  use_ema: true
  vocoder_name: vocos
  vocoder_path: null
  target_sample_rate: 24000
  nfe_step: 32
  cfg_strength: 2.0
  sway_sampling_coef: -1.0
  speed: 1.0
  seed: 0

input_key: [text, ref_speech, ref_text]
batch_size: null
output_fn: src.inference.build_output
output_artifacts:
  wav:
    type: wav
    sample_rate: 24000

provider:
  _target_: espnet3.systems.base.inference_provider.InferenceProvider
runner:
  _target_: espnet3.systems.base.inference_runner.InferenceRunner
