#################################################################
#  Ingest the MOSS-TTSD baseline's ZipVoice-Dialog test-en output  #
#################################################################
# `mode: ingest_external_system` (src/external_system_ingest.py) reads one
# wav per dialogue from another system's own inference run and writes our
# output contract, so our metrics config scores it with the pipeline our own
# arms go through.  No model, no GPU.
#
# MOSS-TTSD emits ONE MONO TRACK per dialogue and has no per-speaker output
# at any point, so this is a mixture-only arm: `ingest.output: mixture`, and
# conf/metrics_moss_ttsd_mixture.yaml is the ONLY correct metrics config for
# it.  QUOTE ONLY wer_mix AND utmos_mix.  wer_channel duplicates wer_mix
# here and utmos_ipu is measured over mixture IPUs; neither is a per-channel
# number.
#
# Generated outside this repo with OpenMOSS/MOSS-TTSD at 04fe1d85 and their
# published recipe, fed OUR v2 prompts and OUR script segmentation via
# local/make_moss_ttsd_jsonl.py, then mapped back onto our dialogue ids by
# local/moss_ttsd_collect.py (their wavs are named by input line number).
#
#   python run.py --stages infer measure \
#       --inference_config conf/inference_moss_ttsd_baseline.yaml \
#       --metrics_config   conf/metrics_moss_ttsd_mixture.yaml
#
# READ THE ROWS AGAINST OUR **pred** ARMS ONLY: this system is
# autoregressive and predicts its own durations, so there is no
# oracle-duration counterpart.  And v2 rows compare only to the v2 anchor.
training_config: conf/training_poc.yaml
exp_tag: eval_zipvoice_dialog
mode: ingest_external_system
device: cpu
inference_dir: ${exp_dir}/infer_moss_ttsd_v2
test_name: valid

testset:
  manifest: downloads/zipvoice-dialog-test-en-v2/manifest.jsonl
  name: zipvoice-dialog-test-en-v2

# Provenance, copied verbatim into every meta JSON: a results table can then
# never be read without knowing which system and which recipe produced it.
system:
  name: moss-ttsd-v1.0
  repo: https://github.com/OpenMOSS/MOSS-TTSD
  commit: 04fe1d85
  checkpoint: OpenMOSS-Team/MOSS-TTSD-v1.0 + OpenMOSS-Team/MOSS-Audio-Tokenizer
  prompts: v2-normalized (-23 dBFS active RMS), mono, ours
  params: >-
    mode=voice_clone_and_continuation batch_size=1 text_normalize=on
    sample_rate_normalize=on max_new_tokens=8192 temperature=1.1 top_p=0.9
    top_k=50 repetition_penalty=1.1 seed=42 attn=sdpa (flash-attn absent)

ingest:
  output: mixture
  wav_dir: /work/hdd/bbjs/ttrachu/development/MOSS-TTSD/exp_baseline/collected/v2
  suffix: .wav
  # Unused in mixture mode: there is one track and no ordering to check.
  verify_channel_map: false
  channel_order: null

selection:
  dialogue_ids: null
  min_duration: null
  max_duration: null
  num_dialogues: null
  seed: 0
