##########################################################
#                    DEMO PACK SETTING                   #
##########################################################
# Quick usage:
#   python run.py --stages pack_demo \
#       --training_config conf/training.yaml --demo_config conf/demo.yaml
#   python run.py --stages upload_demo \
#       --training_config conf/training.yaml --demo_config conf/demo.yaml
#
# Pass `--training_config` too: `run.py` copies its `exp_tag` here, which
# `model.dir_or_tag` and `upload_demo.hf_repo` are built from.
#
# Main stages and what this config is used for:
# - `pack_demo`: packs `demo.yaml`, `ui.app_script`, and `pack.include`
# - `upload_demo`: uploads the packed demo directory
recipe_dir: .

##########################################################
#                    MODEL SOURCE                        #
##########################################################
# `model.dir_or_tag` selects the packed model used by the demo.
# - local packed directory relative to the demo dir, e.g. `../model_pack`
# - remote model tag understood by `espnet_model_zoo`
#
# `model.trust_user_code` is true because the packed inference config names
# the recipe's own `src.inference.build_output`, which is shipped inside the
# bundle and has to be imported from it.
#
# `model.call_args` is passed at inference call time as:
#   model(sample, **call_args)
# F5-TTS takes no call-time arguments; sampling settings such as
# `ode_solver_steps` live in the packed `conf/inference.yaml`.
model:
  dir_or_tag: exp/${exp_tag}/model_pack
  trust_user_code: true
  call_args: {}

##########################################################
#                     UI DEFINITION                      #
##########################################################
# `ui.app_script` is copied into the packed demo as `app.py`. Copy this
# template's `src/app.py` into the recipe's `src/`.
#
# `ui.inputs` and `ui.outputs` define the Gradio wiring used by `src/app.py`.
# - `key`: model-facing field name
# - `type`: registered built-in UI asset type such as `audio` or `text`
# - `label`: UI label shown in Gradio
#
# The app binds input/output components positionally, so keep the entries in
# this order. An empty "Reference transcript" box is passed as "not given",
# and the reference is then treated as a recording of the target text.
ui:
  app_script: src/app.py
  title: ${set_corpus_and_system:} demo
  description: README.md
  inputs:
    - key: text
      type: text
      label: "Text to synthesize"
    - key: reference_speech
      type: audio
      label: "Reference speech (voice to clone)"
    - key: reference_text
      type: text
      label: "Reference transcript"
  outputs:
    - key: wav
      type: audio
      label: "Synthesized speech"

##########################################################
#                    PACKING SETTING                     #
##########################################################
# `pack.include` copies extra files or directories into the packed demo.
# Globs are supported, e.g. `assets/**/*.png`.
#
# `pack.exclude` removes matches from copied include directories.
#
# `pack.readme` renders the Hugging Face Space README.md. Values under
# `readme_context` override the defaults inferred by `pack_demo`.
pack:
  out_dir: demo
  include: []
  exclude: []
  # Python packages written to requirements.txt in the packed demo.
  # The `train` extra brings in Hydra, which builds the model from the packed
  # configs; the `tts` extra brings in the vocoder (`vocos`) and the pinyin
  # tokenizer dependencies F5-TTS uses.
  requirements:
    - "espnet[train,tts] @ git+https://github.com/espnet/espnet.git"
  readme: ${config_path:../src/hf_demo_readme.md}
  readme_context:
    title: ${ui.title}
    emoji: "\U0001f5e3️"
    color_from: blue
    color_to: green
    sdk: gradio
    app_file: app.py
    pinned: "false"
    license: apache-2.0
    tags: |-
      - espnet
      - espnet3
      - gradio
      - text-to-speech
      - f5-tts
    hf_repo: ${upload_demo.hf_repo}
    model_ref: ${model.dir_or_tag}

##########################################################
#                    UPLOAD SETTING                      #
##########################################################
# Upload target used by `upload_demo`.
upload_demo:
  hf_repo: espnet/${set_corpus_and_system:}_${exp_tag}
  # organization: your-org
  # update: false (default) raises an error if the Space already exists,
  # preventing accidental overwrites of a published demo.
  # Set to true to upload over an existing Space.
  update: false
  # Glob patterns of existing Space files to delete before uploading.
  # Only used when update: true. Default ["*"] fully replaces the Space
  # contents. Set to [] for an additive upload.
  delete_patterns:
    - "*"
